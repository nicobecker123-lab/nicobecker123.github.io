<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SystemOS 3D-Sandkasten</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
:root{--bg:#0F1512;--surface:#141C18;--ink:#E2E8E3;--muted:#9AA69F;--line:#2B3731;--accent:#D08A57;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar h1{margin:0 6px 0 0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.grp{display:inline-flex;align-items:center;gap:6px}
.grp>label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
button,input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button[data-lock=x][aria-pressed=true]{background:#E4674F;color:#0F1512}
.seg button[data-lock=y][aria-pressed=true]{background:#4DB57C;color:#0F1512}
.seg button[data-lock=z][aria-pressed=true]{background:#5FA6B8;color:#0F1512}
button.primary{background:var(--accent);color:#0F1512;border-color:var(--accent);font-weight:600}
input[type=range]{padding:0;width:110px;accent-color:var(--accent)}
input[type=search]{width:170px}
.val{min-width:1.4em;text-align:right;font-variant-numeric:tabular-nums}
.spacer{flex:1}
#stage{position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#panel{position:absolute;top:10px;right:10px;width:300px;max-height:calc(100% - 20px);overflow:auto;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:none}
#panel h2{margin:0 0 6px;font-size:15px;word-break:break-word}
#panel .pill{display:inline-block;font:500 11px/1 ui-monospace,monospace;text-transform:uppercase;padding:4px 7px;border-radius:99px;border:1px solid var(--c);color:var(--c);margin-bottom:8px}
#panel p{margin:6px 0}
#panel .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
#panel .path{font:11.5px ui-monospace,monospace;color:var(--muted);word-break:break-all}
#panel a{color:var(--accent)}
#hud{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:12px;pointer-events:none;max-width:60%}
#hud b{color:var(--ink);font-weight:500}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:7px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;display:none;max-width:320px;word-break:break-word}
#lex{position:absolute;top:10px;left:10px;width:330px;max-height:calc(100% - 20px);display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#lex[hidden]{display:none}
#lex .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#lex .row b{font-size:14px}
#lexProg{color:var(--muted);font-variant-numeric:tabular-nums;flex:1}
#lexQ{flex:1;min-width:0}
#lexList{overflow:auto;min-height:60px;border-top:1px solid var(--line)}
#lexList .fold{position:sticky;top:0;background:var(--surface);color:var(--muted);font:11px ui-monospace,monospace;padding:6px 2px 3px;word-break:break-all}
#lexList .doc{display:flex;gap:6px;align-items:flex-start;padding:2px 0}
#lexList .doc input{margin-top:3px}
#lexList .doc button{border:0;background:none;padding:1px 3px;text-align:left;word-break:break-all}
#lexList .doc.cur button{color:var(--accent);font-weight:600}
#lexList .doc.done button{color:var(--muted);text-decoration:line-through}
#lexList .doc small{color:var(--muted);white-space:nowrap}
@media (max-width:760px){#lex{width:auto;right:10px;max-height:42%}}
@media (max-width:760px){#panel{width:auto;left:10px;top:auto;bottom:10px;max-height:45%}#hud{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <h1>SystemOS 3D-Sandkasten</h1>
    <div class="grp"><label>Bewegen</label>
      <div class="seg" id="lock" role="group" aria-label="Bewegungsachse">
        <button type="button" data-lock="free" aria-pressed="true" title="Taste 1">Frei</button>
        <button type="button" data-lock="x" aria-pressed="false" title="Taste 2">X</button>
        <button type="button" data-lock="y" aria-pressed="false" title="Taste 3">Y</button>
        <button type="button" data-lock="z" aria-pressed="false" title="Taste 4">Z</button>
      </div>
    </div>
    <div class="grp"><label for="depth">Ebene</label><input id="depth" type="range" min="0" max="8" value="2"><span class="val" id="depthV">2</span></div>
    <div class="grp"><label for="labelDepth">Labels</label><input id="labelDepth" type="range" min="0" max="8" value="1"><span class="val" id="labelV">1</span></div>
    <div class="grp"><input id="q" type="search" placeholder="Knoten suchen …" autocomplete="off"><button type="button" id="qNext">Weiter</button></div>
    <span class="spacer"></span>
    <div class="grp">
      <button type="button" id="lexToggle" title="Alle Dokumente erfassen, Schritt für Schritt">Lexikon</button>
      <button type="button" id="attach" title="JSON aus tools/scan_folder.py an den gewählten Knoten hängen">Ordner-Scan anhängen</button>
      <button type="button" id="attachRepos" title="Repo-Scan (data/repos-scan.json) an den gewählten Knoten hängen">Repo-Scan laden</button>
      <button type="button" id="resetPos" title="Alle verschobenen Äste zurücksetzen">Positionen zurücksetzen</button>
      <button type="button" id="fit">Ansicht</button>
      <button type="button" id="export">Export</button>
      <button type="button" id="import">Import</button>
      <button type="button" id="save" class="primary" title="Strg+S">Zustand speichern</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="tip"></div>
    <div id="hud"><b>Maus:</b> links ziehen = drehen · rechts ziehen = verschieben · Rad = Zoom · <b>Knoten:</b> ziehen = Ast bewegen · Klick = auf-/zuklappen · Doppelklick = fokussieren · Tasten 1–4 = Achse</div>
    <aside id="lex" hidden>
      <div class="row"><b>Lexikon</b><span id="lexProg"></span><button type="button" id="lexClose" aria-label="Schließen">×</button></div>
      <div class="row"><input id="lexQ" type="search" placeholder="Dokument oder Ordner filtern …" autocomplete="off"><label><input type="checkbox" id="lexOpen"> nur offene</label></div>
      <div class="row"><button type="button" id="lexPrev">‹ Zurück</button><button type="button" id="lexDone" class="primary">Erfassen &amp; weiter</button><button type="button" id="lexSkip">Weiter ›</button></div>
      <div id="lexList"></div>
      <div class="row"><button type="button" id="lexExport">Als Markdown exportieren</button></div>
    </aside>
    <aside id="panel" aria-live="polite"></aside>
    <div id="toast"></div>
  </div>
</div>
<input id="file" type="file" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
